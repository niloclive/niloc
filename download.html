<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NILOC Prime - Experience the Stream</title>
    <link rel="stylesheet" href="download.css">
    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 1. HEADER -->
    <header class="main-header">
        <div class="container header-content">
            <div class="logo">
                <span class="logo-n">N</span>ILOC <span class="logo-prime">Prime</span>
            </div>
        </div>
    </header>

    <!-- 2. HERO / MAIN CONTENT (No CTA, No Mockup) -->
    <main class="hero-minimal">
        <div class="container content-wrapper">
            <h1 class="main-headline">
                The Evolution of <br>Digital Entertainment
            </h1>
            <p class="sub-headline">
                A seamless ecosystem built for creators and consumers. <br>
                Fast. Secure. Immersive.
            </p>
            
            <!-- Just a simple text indicator of what's coming -->
            <div class="platform-tag">
                <span>Launching on Web, iOS, Android, & Smart TVs</span>
            </div>
        </div>
    </main>

    <!-- 3. FOOTER (Social Links Only) -->
    <footer class="main-footer">
        <div class="container footer-content">
            <div class="social-links">
                <a href="https://instagram.com/nilocprime" target="_blank" class="social-item" title="@nilocprime on Instagram">
                    <i class="fab fa-instagram"></i>
                    <span class="handle">/nilocprime</span>
                </a>
                <a href="https://linkedin.com/company/nilocprime" target="_blank" class="social-item" title="@nilocprime on LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                    <span class="handle">/nilocprime</span>
                </a>
            </div>
            <div class="copyright">
                &copy; 2023 NILOC Prime. All Rights Reserved.
            </div>
        </div>
    </footer>

</body>
</html>
